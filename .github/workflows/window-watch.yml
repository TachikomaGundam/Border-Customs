name: window-watch
# Standing guard-sentry (council 3bd5 hardening): scheduled patrol of the border-guard
# ruleset + main ref, NOT window-only. Any deviation files a SECURITY issue.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      window_minutes: { required: false, type: string, default: "0" }
permissions:
  contents: read
  issues: write
jobs:
  patrol:
    runs-on: ubuntu-latest
    steps:
      - name: snapshot and assert
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          R="$GITHUB_REPOSITORY"
          RS=$(gh api "repos/$R/rulesets" 2>/dev/null || echo ERROR)
          RS_SHA=$(printf '%s' "$RS" | sha256sum | awk '{print $1}')
          GUARD=$(printf '%s' "$RS" | python3 -c 'import json,sys
          try:
              rs=[x for x in json.load(sys.stdin) if x["name"]=="border-guard"]
              if not rs: print("MISSING"); raise SystemExit
              g=rs[0]
              nff=any(r["type"]=="non_fast_forward" for r in g["rules"])
              bypass=[a.get("actor_id") for a in g.get("bypass_actors",[])]
              enf=g["enforcement"]
              print(("OK" if (enf=="active" and nff and bypass==[296048333]) else "DEVIATION") + " enforcement="+enf+" nff="+str(nff)+" bypass="+str(bypass))
          except Exception as e:
              print("UNREADABLE")')
          REFS=$(gh api "repos/$R/git/ref/heads/main" --jq '.object.sha' 2>/dev/null || echo ERROR)
          echo "PATROL ts=$(date -u +%FT%TZ) guard=$GUARD main=$REFS rulesets_sha=$RS_SHA" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$GUARD" != OK ] && [ "$GUARD" != MISSING ]; then
            if gh issue list -R "$R" --state open --label security --search "guard-deviation" --json title | grep -q guard-deviation; then
              echo "open incident exists"
            else
              gh issue create -R "$R" --label security --title "guard-deviation: border-guard ruleset outside expected state" --body "Patrol found state=$GUARD main=$REFS at $(date -u +%FT%TZ). Ruleset snapshot sha $RS_SHA. Investigate immediately; scrub window may be open legitimately ONLY between the two disclosure rows in SECURITY.md." || true
            fi
          fi
