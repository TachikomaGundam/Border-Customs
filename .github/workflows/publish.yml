# Publish border-customs to npm via Trusted Publishing (OIDC) — zero tokens.
#
# Prerequisite (registry side, one-time): the npm package `border-customs`
# must carry a Trusted Publisher for repo TachikomaGundam/Border-Customs,
# workflow file .github/workflows/publish.yml, and a matching environment
# (if one is configured on npm — keep both sides identical or neither).
# `id-token: write` mints the OIDC assertion npm validates; there is
# deliberately NO npm auth token of any kind anywhere in this file — one
# would bypass and defeat Trusted Publishing entirely. In particular setup-node
# must NOT be given registry-url: that input makes it inject a masked
# NODE_AUTH_TOKEN (a github.token, invalid on npmjs) into the runner npmrc,
# which would silently defeat the tokenless OIDC path below.
#
# Events: pushing a v* tag runs the full gate AND publishes. A manual
# workflow_dispatch runs everything up to and including the pack check as a
# gate rehearsal, then skips the publish step — publishing is tag-push-only.
#
# Provenance: public repo + public package on GitHub-hosted runners lets npm
# auto-attest, but reports show auto-provenance flaky on first publishes, so
# `--provenance` is passed explicitly. `--access public` is harmless for an
# already-public package and future-proofs a fresh-name publish.
name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: # manual run of THIS file only (no workflow_call by design)

jobs:
  publish:
    runs-on: ubuntu-latest # GitHub-hosted only — npm TP does not support self-hosted runners
    permissions:
      contents: read
      id-token: write # REQUIRED for npm Trusted Publishing (OIDC)
    env:
      REF_NAME: ${{ github.ref_name }}
      EVENT_NAME: ${{ github.event_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          # NO registry-url here on purpose: setup-node only mints/injects
          # NODE_AUTH_TOKEN when registry-url is set, and an _authToken npmrc
          # makes npm take the token path instead of OIDC Trusted Publishing.
          # npm defaults to registry.npmjs.org anyway; TP must stay token-free.
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Version / tag consistency
        run: |
          set -eu
          PKG_VERSION="$(node -p 'require("./package.json").version')"
          echo "package.json version: ${PKG_VERSION}"
          if [ "${EVENT_NAME}" = "push" ]; then
            if [ "${REF_NAME}" != "v${PKG_VERSION}" ]; then
              echo "::error::git tag '${REF_NAME}' does not match package.json version 'v${PKG_VERSION}'"
              exit 1
            fi
            echo "tag ${REF_NAME} matches v${PKG_VERSION}"
          else
            echo "workflow_dispatch: skipping tag compare (untagged ${PKG_VERSION} cut)"
          fi

      - name: Build
        run: npm run build

      - name: Post-build smoke
        run: |
          set -eu
          # NOTE: the CLI intentionally has no --version flag (src/cli.ts exits 2
          # on unknown commands), so the version is proven from package.json here
          # and the built entry is exercised via --help. Deliberate deviation from
          # the original brief — do not add --version to the CLI just for CI.
          node -p 'require("./package.json").version'
          node dist/index.js --help > /dev/null
          echo "smoke ok: dist/index.js built, --help exits 0"

      # EXTERNAL-PREREQUISITE AUDIT (src/ grep, 2026-09-09) — what ubuntu-latest
      # already ships vs what we pin here:
      #   image:     git, cargo (channels/crates.ts:332, artifacts/crates.ts:121,
      #              ledger/freshness.ts:82), gem (channels/rubygems.ts:276,
      #              artifacts/rubygems.ts:147, ledger/freshness.ts:114),
      #              python3+pip (ubuntu-latest preinstalled), docker, node@24.
      #   pin here:  gitleaks 8.30.1 binary — ~14 test files hard-gate via
      #              test/helpers/require-engines.ts (fail loud, never skip;
      #              probes PATH then ~/.local/bin); build+twine python modules —
      #              src/artifacts/pypi.ts:88 requireModule probes
      #              `python3 -m <mod> --version` (exit-0 gate), pypi.ts:123 then
      #              runs the real `python3 -m build --no-isolation`;
      #              setuptools==78.1.1 — with --no-isolation the fixture's
      #              [build-system] requires are IGNORED and the AMBIENT
      #              setuptools executes setup.py, so it must equal the version
      #              the suite was verified against (test/fixtures/residue/
      #              l-py-clean/pyproject.toml pin + local probe 78.1.1);
      #              wheel==0.46.3 completes the locally-verified module set;
#              httpx==0.28.1 - the R3a-E fixture declares it in
#              [build-system] requires and --no-isolation checks it against
#              the AMBIENT interpreter (dev box happens to carry 0.28.1).
      #   not needed: trufflehog — src/engines/trufflehog.ts exists but the suite
      #              never spawns the real binary (stub seams only; proven by
      #              exit-0 local full run on a box without trufflehog).
      # runner python3 is PEP-668 externally-managed ⇒ --user --break-system-packages.
      - name: Provision test/scan prerequisites (gitleaks 8.30.1 + pinned pip modules)
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          cd "$(mktemp -d)"
          curl -fsSLO https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          curl -fsSLO https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_checksums.txt
          grep ' gitleaks_8.30.1_linux_x64.tar.gz$' gitleaks_8.30.1_checksums.txt | sha256sum -c -
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks
          install -m 0755 gitleaks "$HOME/.local/bin/gitleaks"
          "$HOME/.local/bin/gitleaks" --version
          python3 -m pip install --user --break-system-packages \
            build==1.6.0 twine==7.0.0 wheel==0.46.3 setuptools==78.1.1 httpx==0.28.1
          python3 -m build --version
          python3 -m twine --version
          python3 -c 'import setuptools; print("setuptools", setuptools.__version__)'
          python3 -c 'import httpx; print("httpx", httpx.__version__)'

      # RELEASE GATE (fail-closed): run the suite, allow ONLY the exact sanctioned
      # failing tests below. Any other failure, ANY sanctioned test newly passing,
      # or unparsable TAP counts ⇒ exit 1.
      # FORENSICS (W33 I4 triage): the full TAP transcript of every gate run — green
      # or red — is archived by the "Upload full test log" step below, and each
      # fail-closed red branch additionally dumps the per-red TAP YAML detail into
      # the step log itself. Verdict semantics (exit codes, allowlist, parsing) are
      # unchanged by these additions.
      #
      # ALLOWLIST RETIREMENT: these two reds belong to the in-progress push-channels
      # scope (.omo/plans/border-push-channels.md, C5 cross-channel integration);
      # replace this step with a plain `npm test` when that scope lands and
      # C5-1 / C5-4 go green.
      - name: Release gate (npm test, fail-closed sanctioned-failure allowlist)
        run: |
          # errexit OFF: the runner's default `bash -e` kills this script at the
          # intentional red `npm test` before TEST_EXIT=$? is captured; every
          # failure path below already echoes ::error:: and exits 1 explicitly.
          set +e; set -u
          TEST_LOG="$(mktemp)"; trap 'rm -f "$TEST_LOG"' EXIT
          BORDER_PACK_TEST=1 npm test > "$TEST_LOG" 2>&1
          TEST_EXIT=$?
          tail -n 20 "$TEST_LOG"
          # Archive BEFORE the EXIT trap deletes $TEST_LOG, so the "Upload full test
          # log" step ships the corpse regardless of which branch fails below. The
          # copy is read-only forensics: every parse/diff still runs on "$TEST_LOG".
          LOG_ARCHIVE="${RUNNER_TEMP:-/tmp}/border-test-log.txt"
          cp "$TEST_LOG" "$LOG_ARCHIVE" 2>/dev/null || true
          # h4 evidence: the runner's resource shape at gate time (cores, load,
          # memory, disk, node/npm) — archived alongside the log below.
          { date -u +"%FT%TZ"; nproc; cat /proc/loadavg; free -m | head -n 3; node -v; npm -v; df -h "$PWD" | tail -n 1; } > "${RUNNER_TEMP:-/tmp}/border-env-snapshot.txt" 2>/dev/null || true

          SUM_TESTS="$(sed -n 's/^# tests \([0-9][0-9]*\)$/\1/p' "$TEST_LOG" | tail -n 1)"
          SUM_PASS="$(sed -n 's/^# pass \([0-9][0-9]*\)$/\1/p' "$TEST_LOG" | tail -n 1)"
          SUM_FAIL="$(sed -n 's/^# fail \([0-9][0-9]*\)$/\1/p' "$TEST_LOG" | tail -n 1)"
          # node TAP's "# tests" total INCLUDES skipped tests but "# pass"/"# fail"
          # exclude them, so the "# skipped N" count joins the balance equation
          # below (line verified present in the tap reporter; absent ⇒ 0, never a
          # parse failure — skips must not fake an unparsable-summary exit).
          SUM_SKIPPED="$(sed -n 's/^# skipped \([0-9][0-9]*\)$/\1/p' "$TEST_LOG" | tail -n 1)"
          [ -z "$SUM_SKIPPED" ] && SUM_SKIPPED=0
          if [ -z "$SUM_TESTS" ] || [ -z "$SUM_PASS" ] || [ -z "$SUM_FAIL" ]; then
            echo "::error::could not parse TAP summary counts (# tests/# pass/# fail) — failing closed"
            exit 1
          fi

          # sanctioned-failure allowlist — the ONE obvious constant (exact TAP
          # titles, compared set-wise against every '^not ok ' line)
          # ALLOWLIST v4 (W3.2, 2026-09-12): the three dev-box-golden reds are RETIRED at
          # source by NORMALIZING their goldens (.omo/plans/border-inspect-roadmap.md W3.2,
          # evidence .omo/evidence/residue-spike/W32-GOLDEN-NORMALIZATION.md): the channels
          # golden no longer pins the checkout-location-bound raw key (rulesHash hashes
          # absolute fingerprint-source paths by design) but every key component + a
          # path-canonicalized rulesHash + an independent composition recompute; the .gem
          # stage/freshness parity is a normalized CONTENT digest (gunzipped data.tar.gz
          # canonicalized per entry + metadata minus rubygems_version/gem_version/date and
          # the empty deprecated 3.4.x serializer keys), not the raw file sha256 whose
          # per-environment determinism was the W3.1 flaky-green coin flip (root cause
          # reproduced locally: RubyGems 3.4.20, the runner image's builder, stamps the
          # build second into metadata date + gzip mtimes). All three are GREEN on the
          # runner and the dev box (runner proof in the evidence file).
          # v3 (W3.1, 2026-09-11) had retired the I1/AC1/AC3 verdaccio trio (colorette CI-ANSI
          # counter blindness; NO_COLOR=1 + stripAnsi at source). The exact-set rule stays
          # FULLY fail-closed — the only remaining entries are the two PLANNED border-push-
          # channels C5 WIP reds. ANY other failure, ANY entry newly passing, or a counts
          # mismatch still exits 1.
          cat > /tmp/sanctioned.txt <<'SANCTIONED'
          # PLANNED WIP red (border-push-channels C5) - retire when that scope lands
          C5-1 subset discipline: a git-only PASS authorizes NO publish leg; a full PASS authorizes no crates-only push (fingerprint effectiveTargets scope binding)
          # PLANNED WIP red (border-push-channels C5) - retire when that scope lands
          C5-4 ordering: publish legs execute in descriptor order git→npm→pypi→crates→rubygems (exact spawn sequence), all five push-records under ONE key
          SANCTIONED
          sed -i -e 's/^[[:space:]]*//' -e '/^#/d' /tmp/sanctioned.txt

          grep '^not ok ' "$TEST_LOG" | sed -E 's/^not ok [0-9]+ - //' | sort > /tmp/actual-failures.txt
          sort /tmp/sanctioned.txt > /tmp/sanctioned.sorted.txt

          if ! diff -u /tmp/sanctioned.sorted.txt /tmp/actual-failures.txt; then
            echo "::error::failing-test set is NOT exactly the sanctioned allowlist (diff above: - expected / + actual) — failing closed"
            # Dump each actual red's TAP YAML error block into the step log before
            # the trap deletes $TEST_LOG (W32 residual: I4 detail was unrecoverable).
            echo '::group::not-ok TAP detail (grep -A 25 "^not ok ")'
            grep -A 25 '^not ok ' "$TEST_LOG" || true
            echo '::endgroup'
            # Verdaccio server logs + fixture state survive under test/tmp — the
            # counter-flush race (h2) is only decidable from the server-side clock.
            tar -czf "${RUNNER_TEMP:-/tmp}/border-testtmp.tgz" test/tmp 2>/dev/null || true
            exit 1
          fi

          ACTUAL_N="$(grep -c . /tmp/actual-failures.txt || true)"
          if [ "$SUM_FAIL" != "$ACTUAL_N" ] || [ "$((SUM_PASS + SUM_FAIL + SUM_SKIPPED))" != "$SUM_TESTS" ] || [ "$SUM_FAIL" -eq 0 ]; then
            echo "::error::TAP counts inconsistent (tests=${SUM_TESTS} pass=${SUM_PASS} fail=${SUM_FAIL} not-ok-lines=${ACTUAL_N}) — failing closed"
            echo '::group::not-ok TAP detail (grep -A 25 "^not ok ")'
            grep -A 25 '^not ok ' "$TEST_LOG" || true
            echo '::endgroup'
            exit 1
          fi
          # with a non-empty allowlist enforced above, a suite carrying exactly the
          # sanctioned reds must exit 1; exit 0 would mean TAP and the runner disagree.
          if [ "$TEST_EXIT" -ne 1 ]; then
            echo "::error::expected 'npm test' to exit 1 (sanctioned reds present); got ${TEST_EXIT} — failing closed"
            exit 1
          fi
          rm -f /tmp/sanctioned.txt /tmp/actual-failures.txt /tmp/sanctioned.sorted.txt
          echo "release gate green: ${SUM_TESTS} tests / ${SUM_PASS} pass / exactly ${SUM_FAIL} sanctioned failure(s) matching the allowlist"

      # if: always() — a cancelled/timed-out run's partial log is forensics too;
      # the gate's own exit code is this step's sibling, never altered by it.
      - name: Upload full test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-log-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/border-test-log.txt
            ${{ runner.temp }}/border-env-snapshot.txt
            ${{ runner.temp }}/border-testtmp.tgz
          if-no-files-found: warn

      - name: Pack and verify tarball
        run: |
          set -eu
          PKG_VERSION="$(node -p 'require("./package.json").version')"
          # dry-run first: surfaces the file list + counts in the job log
          npm pack --dry-run
          TMP="$(mktemp -d)"
          npm pack --pack-destination "$TMP"
          TARBALL="$TMP/border-customs-${PKG_VERSION}.tgz"
          if [ ! -f "$TARBALL" ]; then
            echo "::error::npm pack did not produce ${TARBALL} (name/version mismatch?)"
            exit 1
          fi
          echo "tarball contents:"
          tar -tzf "$TARBALL"
          echo "file count (excluding package/ dir entry): $(tar -tzf "$TARBALL" | grep -vc '^package/$')"
          rm -rf "$TMP"

      - name: Publish (npm Trusted Publishing / OIDC)
        if: github.event_name == 'push' # never publish from an untagged workflow_dispatch tree
        run: npm publish --provenance --access public

      - name: Publish skipped (dry run via workflow_dispatch)
        if: github.event_name != 'push'
        run: "echo 'dry-run: publish only on v* tag push'"

      - name: Post-publish note
        if: github.event_name == 'push' # do not echo a false "published" line in a dispatch rehearsal
        run: |
          PKG_VERSION="$(node -p 'require("./package.json").version')"
          echo "published border-customs@${PKG_VERSION} — verify at:"
          echo "  https://www.npmjs.com/package/border-customs/v/${PKG_VERSION}"
          echo "  provenance: npm audit signatures --package border-customs@${PKG_VERSION}"
