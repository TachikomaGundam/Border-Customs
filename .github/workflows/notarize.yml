name: notarize
# P1 witness: keyless sigstore->rekor. Digest auto-computed; manifest ONLY from
# trusted caller, cross-checked against the exact tarball. Invoked via workflow_call
# from publish.yml (build => pack => notarize(this job) => publish same artifact).
on:
  workflow_call:
    inputs:
      mode:
        required: true
        type: string   # "tip" | "manifest"
      manifest_sha256:
        required: false
        type: string
        default: ""
permissions:
  contents: read
  id-token: write   # sigstore keyless identity
jobs:
  rekor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install sigstore==4.5.1
      - name: compute digest
        id: d
        run: |
          set -euo pipefail
          if [ "${{ inputs.mode }}" = "tip" ]; then
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          elif [ "${{ inputs.mode }}" = "manifest" ]; then
            echo "sha=${{ inputs.manifest_sha256 }}" >> "$GITHUB_OUTPUT"
          else
            echo "unknown mode" >&2; exit 1
          fi
      - name: cross-check manifest against built tarball
        if: inputs.mode == 'manifest'
        run: |
          set -euo pipefail
          test -f build/border-customs.tgz   # packed by the caller workflow, uploaded as artifact
          sha256sum build/border-customs.tgz | awk '{print $1}' | grep -qx "${{ inputs.manifest_sha256 }}"
      - name: sign + upload to rekor
        run: |
          set -euo pipefail
          printf '%s' "${{ steps.d.outputs.sha }}" > digest.txt
          sigstore sign digest.txt --bundle bundle.json 2>&1 | tee sign.log
          IDX=$(python3 <<PYEOF
import json
def f(o):
    if isinstance(o, dict):
        vs = [v for k, v in o.items() if k in ("log_index", "logIndex")]
        return vs + sum((f(x) for x in o.values()), [])
    if isinstance(o, list):
        return sum((f(x) for x in o), [])
    return []
hits = f(json.load(open("bundle.json")))
assert hits, "no log_index in bundle"
print(hits[0])
PYEOF
)
          echo "REKOR_LOG_INDEX=$IDX" | tee -a "$GITHUB_STEP_SUMMARY"
          # readback proof via public retrieve endpoint (fails job if not publicly visible)
          curl -sf -X POST "https://rekor.sigstore.dev/api/v1/log/entries/retrieve" \
            -H "Content-Type: application/json" -d "{\"logIndexes\":[$IDX]}" -o rekor-readback.json
          test -s rekor-readback.json
          echo "REKOR_READBACK_SHA=$(sha256sum rekor-readback.json | awk '{print $1}')" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with: { name: rekor-bundle, path: bundle.json }
