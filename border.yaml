# border's own gate config (plan todo 19 dogfood).
#
# `border check`/`border push` over THIS repository. The repo intentionally
# commits planning artifacts (.omo/) and planted-leak test literals (test/),
# so the naive scan can never PASS without an explicit, enumerated allow-list;
# every suppression below is one `allow` entry with a justification comment and
# shows up in the report's allow-hits section (G14 — nothing hidden silently).
version: 1

targets:
  git:
    # No publish remote yet (todo 21 owns the release). An EXPLICIT empty list
    # is not a discovery failure: repo-local legs (history/tree/identity/
    # artifacts/secretlint) still run; only the exposureSet is empty.
    remotes: []

rules:
  authors:
    # Hardcoded from `git config user.email` == bot@gate-corp.com and
    # `git config user.name` == Wiki.js (captured 2026-09-04 in this repo).
    # 2026-09-30 OWNER RULING ("是，扩", order 8): the remote main lineage was
    # deliberately identity-rewritten to the owner's GitHub noreply identity for
    # GitHub attribution (forensics: .omo/evidence/F-MAINLINE-REWRITE-2026-09-30.md).
    # Both identities are sanctioned from now on; the rewrite rotates rulesHash
    # and invalidates every cached PASS by design.
    emails:
      - "bot@gate-corp.com"
      - "TachikomaGundam@users.noreply.github.com"
    names:
      - "Wiki.js"
      - "TachikomaGundam"
  hosts: []
  ips: []
  # The repo's own absolute path must never leak outward: every occurrence of
  # it in tracked content becomes a finding (category (c) below scopes the
  # sanctioned docs/evidence occurrences out of the verdict).
  pathPatterns:
    - "/home/lab/workspace/harness/border"
  maxFileKB: 500

# Three sanctioned suppression categories (plan round-1 M3). Order matters:
# the filter is FIRST-ENTRY-WINS, so the most specific entry runs first and its
# count reflects exactly its category. Every suppressed finding lands in the
# report's allow-hits section with {rule, count, sample, entry} — G14: nothing
# hidden silently. Unscoped `{rule:"*",match:"*"}` is rejected by the config
# schema (plan Must-NOT); these wildcard pairs are all file-scoped.
allow:
  # (c) the repo's own absolute path, sanctioned wherever it legitimately
  # appears (docs, planning evidence, engine reports). Concrete rule name,
  # so this never hides a secret — only the workspace-path detector.
  - { rule: "path-pattern:/home/lab/workspace/harness/border", match: "*" }
  # (b) our own planted test literals: every engine fixture value (AKIA…,
  # BasicAuth, stripe, …) and the pattern strings tests assert on. Scoped to
  # test/**, where the whole corpus is synthetic by design (plan round-2 M5:
  # the literals live in test/*.test.ts, runtime-generated fixtures aside).
  - { rule: "*", match: "*", file: "test/**" }
  # (b-ext) the tool's own vendored detection signatures: the gitleaks rules
  # TOML contains example keys and UNC-regex sources that match border's own
  # scanners by construction. Pinned to the signature file, whose sha256 is
  # part of rulesHash — any edit changes the fingerprint and re-runs the scan.
  - { rule: "*", match: "*", file: "assets/gitleaks-defaults-v8.30.1.toml" }
  # (b-ext) the build-time copy of that exact pinned file: npm run build
  # replicates assets/gitleaks-defaults-v8.30.1.toml verbatim into dist/assets/
  # (tools/copy-assets.mjs; dist/ is untracked build output, CI never scans it).
  # Byte-identity verified at pinning time (sha256 ea71b30e…4355 on both —
  # re-pinned when the border-vendored exfil rules were appended, T2), so
  # the rulesHash-rot protection of the source pin rides transitively: hostile
  # bytes must enter via the source to survive a rebuild.
  - { rule: "*", match: "*", file: "dist/assets/gitleaks-defaults-*.toml" }
  # (b-ext) the synthetic R1-spike documentation literal (AKIA… masked here
  # per this file's own convention — quoting it raw would self-trigger border):
  # a fabricated fake recorded in CHANNEL-CONTRACTS.md to pin fixture traps,
  # same class as the test/** planted corpus and the vendored gitleaks TOML
  # examples. This file is a CONTRACTS doc whose examples must stay
  # recognizable for the docs tests, so the rule is enumerated (aws-access-token
  # only, not wildcard) and the file is pinned; unscoped secret rules still
  # fire everywhere else.
  - { rule: "aws-access-token", match: "*", file: "src/channels/CHANNEL-CONTRACTS.md" }
  # (b-ext, twin) secretlint's view of the SAME sanctioned literal above. The
  # engine pair scans each file independently and secretlint reports the fixture
  # reuse-literal under its own id namespace (@secretlint/secretlint-rule-aws/
  # AWSAccessKeyID) — same file, same bytes, second name; no new suppression
  # scope. Guard-pinned by the DOC-LIT suite in test/residue.config.test.ts:
  # a NEW AWS-shaped key added to these docs fails the suite even where the
  # scanner is allowlisted here.
  - { rule: "@secretlint/secretlint-rule-aws/*", match: "*", file: "src/channels/CHANNEL-CONTRACTS.md" }
  # (b-ext) backslash/home path literals inside the tool's own pattern-aware
  # sources: src/** (regex handling, ADAPTER-CONTRACT.md docs), tools/**
  # (spike scripts) and the prompt template's example paths. Scoped to the
  # generated path-pattern rule family — real secret rules still fire there.
  - { rule: "path-pattern:*", match: "*", file: "assets/**" }
  - { rule: "path-pattern:*", match: "*", file: "src/**" }
  - { rule: "path-pattern:*", match: "*", file: "tools/**" }
  # (a) .omo/** planning artifacts: Prometheus/Momus/oracle transcripts and
  # evidence intentionally quote leak-hunting literals at absolute /home paths.
  # Everything not caught by (c) above and still inside the planning tree.
  - { rule: "*", match: "*", file: ".omo/**" }
  # (c) border.yaml's own content self-triggers generic detectors: the
  # pathPatterns value above is a literal /home/... string on disk, so
  # secretlint's built-in no-homedir rule and the generic path-pattern
  # matcher (/home/[a-z]+/ from the bundled defaults) both fire ON THIS FILE
  # only. Narrowest sanctioned scope: rule-family glob + file pinned to
  # border.yaml — other files carrying a /home/ path are NOT widened here
  # (they fall under (a)/(b) or stay findings), and hostile-config detection
  # (repo-self-ignores-findings) still guards this file independently.
  - { rule: "@secretlint/secretlint-rule-no-homedir/*", match: "*", file: "border.yaml" }
  - { rule: "path-pattern:*", match: "*", file: "border.yaml" }
  # (c, twin) secretlint's no-homedir view of the workspace-path detector the
  # (c) block already sanctions for "docs, planning evidence, engine reports".
  # The two contract docs quote REAL execution evidence verbatim (readlink
  # output, rc-file excerpts, engine binary paths, sample dirs) — recording
  # where files land on the machine IS their evidentiary job. no-homedir is a
  # path-PRIVACY rule, not a secret rule; every secret-shaped rule (aws twin
  # above excepted per its own comment, generic-api-key, engine defaults)
  # still fires on both files at full strength.
  - { rule: "@secretlint/secretlint-rule-no-homedir/*", match: "*", file: "src/artifacts/RESIDUE-CONTRACT.md" }
  - { rule: "@secretlint/secretlint-rule-no-homedir/*", match: "*", file: "src/channels/CHANNEL-CONTRACTS.md" }
  # (exfil, T5 ruling a) the native exfil lens's home-path view of the SAME
  # already-sanctioned evidence/tooling classes: border@main self-calibration
  # (.omo/evidence/F-EXFIL-T5-2026-09-25.md) found 32 outside-allow
  # exfil-home-path hits over exactly 7 files — the two contract docs plus
  # border.yaml itself already sanctioned above against secretlint's no-homedir
  # twin, and the same evidence-class in ADAPTER-CONTRACT.md, the prompt
  # template, the secretlint spike and secretlint.ts's own pattern comments.
  # Rule-pinned per file (exfil-home-path only — no secret rule widens here);
  # severity stays MEDIUM per the ruling, every suppression enumerated (G14).
  - { rule: "exfil-home-path", match: "*", file: "src/artifacts/RESIDUE-CONTRACT.md" }
  - { rule: "exfil-home-path", match: "*", file: "src/channels/CHANNEL-CONTRACTS.md" }
  - { rule: "exfil-home-path", match: "*", file: "src/engines/ADAPTER-CONTRACT.md" }
  - { rule: "exfil-home-path", match: "*", file: "src/engines/secretlint.ts" }
  - { rule: "exfil-home-path", match: "*", file: "tools/spike-secretlint.mjs" }
  - { rule: "exfil-home-path", match: "*", file: "assets/prompts/llm-review.md" }
  - { rule: "exfil-home-path", match: "*", file: "border.yaml" }
  # (exfil, T5 ruling b) *.env PROPERTY ACCESS inside the tool's own sources:
  # after the T5 calibration tightened the predicate (process.env / short
  # receivers / x?.env dropped at the rule level), the residue is longer code
  # receivers (input.env, entry.env…) — object properties in memory, never
  # disk locations. Mirrors the established path-pattern src/** precedent
  # above: scoped to the generated rule id × src/** only; the message facet
  # (exfil-cred-location:message) is a different id and keeps full teeth, and
  # real .env prose references outside src/** still surface as warnings.
  - { rule: "exfil-cred-location", match: "*", file: "src/**" }
  # (exfil, historical) the pre-ruling-(c) README config example carried a real-
  # shape RFC1918 doc literal in its `ips:` line; that example predates the exfil
  # lens and still rides the git HISTORY (commit 494b1fca… touched that line). The
  # twin history leg flags it per doctrine; history rewrite is out of scope
  # ("border detects, never erases", plan §边界) and the tip now uses RFC5737 doc
  # space. Double-pinned: the value's sha256 (fec9cdea…40dc) × README.md path only —
  # no other value, file, or rule is ever suppressed; enumerated in allowHits (G14).
  # The literal itself is NOT written here: this file's own comment would otherwise
  # trip the very rule it documents (round-3 dogfood lesson).
  - { rule: "exfil-rfc1918", match: "fec9cdeaf025e268325956b138339005d0b106c7b2823ccc21515a71496040dc", file: "README.md" }
  # (exfil, T8) the README's own exfil-home-path row must display the Windows user-profile
  # shape — the pre-existing drive-letter path-pattern fires on the documentation literal.
  # Double-pinned: that value's sha256 (28f709d7…30bf) x README.md path only; no other
  # value, file, or rule is suppressed; enumerated in allowHits (G14).
  - { rule: "path-pattern:[A-Za-z]:\\\\", match: "28f709d79730058e2a461518e34126da18ceda07729e792c92f7ca1251e730bf", file: "README.md" }

engines:
  require:
    - gitleaks
    - secretlint
  trufflehog: false
